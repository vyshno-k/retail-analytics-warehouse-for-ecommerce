name: dbt CI
on: [pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install dbt-bigquery
      - uses: google-github-actions/auth@v2
        with: {credentials_json: "${{ secrets.GCP_SA_KEY }}"}
      - name: Configure profile and build
        run: |
          mkdir -p ~/.dbt
          sed "s/YOUR_GCP_PROJECT_ID/${{ vars.GCP_PROJECT }}/; s/dbt_dev/dbt_ci_${{ github.run_id }}/" profiles.yml.example > ~/.dbt/profiles.yml
          dbt deps && dbt build
