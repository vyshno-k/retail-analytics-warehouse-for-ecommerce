version: 2
models:
  - name: stg_customers
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: email
        tests: [not_null]
  - name: stg_products
    columns:
      - name: product_id
        tests: [unique, not_null]
  - name: stg_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships: {to: ref('stg_customers'), field: customer_id}
      - name: order_status
        tests:
          - accepted_values: {values: ['completed', 'cancelled', 'returned']}
  - name: stg_order_items
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [order_id, product_id]
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships: {to: ref('stg_orders'), field: order_id}
      - name: product_id
        tests:
          - relationships: {to: ref('stg_products'), field: product_id}
